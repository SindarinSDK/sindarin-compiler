name: Compiler toolchain
description: Use the same pinned C/Rust toolchains for builds and shared-artifact tests
inputs:
  build_deps:
    description: Install project libraries for the build job
    default: 'false'
  rust_target:
    description: Additional Rust target needed for platform runtime tests
    default: ''
runs:
  using: composite
  steps:
  - name: Setup prerequisites (Linux)
    if: runner.os == 'Linux'
    run: |
      if ! command -v gcc >/dev/null || ! command -v make >/dev/null || ! command -v python3 >/dev/null; then
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential python3
      fi
    shell: bash
  - name: Setup prerequisites (macOS)
    if: runner.os == 'macOS'
    run: brew install python3
    shell: bash
  - name: Cache pinned Windows toolchain
    if: runner.os == 'Windows'
    uses: actions/cache@v6
    with:
      path: .sn/toolchains/llvm-mingw
      key: llvm-mingw-20260616-ucrt-x86_64-b9b68a4d
  - name: Install LLVM-MinGW (Windows)
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      $version = "20260616"
      $expectedHash = "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"
      $extractPath = Join-Path $env:GITHUB_WORKSPACE ".sn\toolchains\llvm-mingw"
      if (-not (Test-Path $extractPath)) {
        $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip"
        $zipPath = "$env:TEMP\llvm-mingw.zip"
        Invoke-WebRequest -Uri $url -OutFile $zipPath
        if ((Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
          throw "LLVM-MinGW archive SHA-256 mismatch"
        }
        Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
      }
      $llvmDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
      Join-Path $llvmDir.FullName "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
  - name: Install Make and Ninja (Windows)
    if: runner.os == 'Windows'
    shell: pwsh
    run: choco install make ninja -y
  - name: Pin Rust toolchain
    shell: bash
    run: |
      rustup toolchain install 1.93.1 --profile minimal
      rustup default 1.93.1
      if [ -n "${{ inputs.rust_target }}" ]; then
        rustup target add --toolchain 1.93.1 "${{ inputs.rust_target }}"
      fi
      rustc --version --verbose
      if [ "$RUNNER_OS" = "Windows" ]; then clang --version; fi
  - name: Checkout Windows build dependencies
    if: runner.os == 'Windows' && inputs.build_deps == 'true'
    uses: actions/checkout@v6
    with:
      repository: SindarinSDK/sindarin-pkg-libs
      ref: 793df6f63d07146d19dffa8f6c172a1f56660b4a
      path: .sn/sindarin-pkg-libs
      persist-credentials: false
  - name: Install Windows build dependencies
    if: runner.os == 'Windows' && inputs.build_deps == 'true'
    shell: pwsh
    working-directory: .sn/sindarin-pkg-libs
    run: |
      & ./scripts/install.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if (-not (Test-Path 'libs/windows/lib') -or -not (Test-Path 'libs/windows/include')) {
        throw 'Windows dependency archive did not provide libraries and headers'
      }
  - name: Setup libs
    if: runner.os != 'Windows' && inputs.build_deps == 'true'
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    run: make setup
  - name: Verify pinned Windows compiler after setup
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      $toolchainRoot = Join-Path $env:GITHUB_WORKSPACE ".sn\toolchains\llvm-mingw"
      $toolchain = Get-ChildItem $toolchainRoot -Directory | Select-Object -First 1
      $expected = Join-Path $toolchain.FullName "bin\clang.exe"
      $selected = (Get-Command clang.exe).Source
      if ($selected -ne $expected) { throw "Expected pinned clang $expected, selected $selected" }
      clang --version
