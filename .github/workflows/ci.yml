# One build per platform feeds isolated C, Rust and parity jobs.
name: Compiler
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
    - develop
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  # Preserve every main revision while development continues alongside CI.
  # PR revisions share a group so only their latest checks need to finish.
  group: compiler-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: &platforms
        - os: ubuntu-latest
          artifact_name: sn-linux-x64
          exe_ext: ''
          runtime_dir: gcc
          sn_cc: gcc
          sn_cflags: ''
          sn_release_cflags: ''
          rust_target: ''
          rust_flags: ''
        - os: windows-latest
          artifact_name: sn-windows-x64
          exe_ext: .exe
          runtime_dir: clang
          sn_cc: clang
          sn_cflags: --target=x86_64-w64-mingw32 -fuse-ld=lld -rtlib=compiler-rt -unwindlib=none
          sn_release_cflags: -O3 -fwrapv
          rust_target: x86_64-pc-windows-gnullvm
          rust_flags: --target=x86_64-pc-windows-gnullvm -C linker=clang
        - os: macos-latest
          artifact_name: sn-darwin-x64
          exe_ext: ''
          runtime_dir: gcc
          sn_cc: clang
          sn_cflags: ''
          sn_release_cflags: ''
          rust_target: ''
          rust_flags: ''
    steps:
    - &checkout
      name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Setup compiler toolchain
      timeout-minutes: 30
      uses: ./.github/actions/compiler-toolchain
      with:
        rust_target: ${{ matrix.rust_target }}
        build_deps: 'true'
    - name: Verify CI artifact and coverage helpers
      shell: bash
      run: python3 -m unittest discover -s tests/ci -v
    - name: Build compiler once
      shell: bash
      run: make build
    - name: Verify staged outputs
      shell: bash
      run: |
        test -f "bin/sn${{ matrix.exe_ext }}"
        test -f "bin/tests${{ matrix.exe_ext }}"
        test -f "bin/lib/${{ matrix.runtime_dir }}/libsn_runtime_min.a"
    - name: Check formatting
      shell: bash
      run: bin/sn${{ matrix.exe_ext }} --format --check
    - name: Package compiler and project libraries
      shell: bash
      run: python3 scripts/ci/build_bundle.py pack .sn/compiler-bundle.tar.gz
    - name: Share the exact build with test jobs
      uses: actions/upload-artifact@v7
      with:
        name: compiler-bundle-${{ matrix.os }}
        path: .sn/compiler-bundle.tar.gz
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
  tests:
    name: Tests / ${{ matrix.group }} (${{ matrix.os }})
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        group:
        - c
        - rust
        - core
        - native
        - arrays
        - closures
        - callbacks
        - numeric-io
        - sanitizers
        - callback-sanitizers
        include: *platforms
        exclude:
        - os: windows-latest
          group: sanitizers
        - os: windows-latest
          group: callback-sanitizers
        - os: macos-latest
          group: sanitizers
        - os: macos-latest
          group: callback-sanitizers
    env:
      SN_CC: ${{ matrix.sn_cc }}
      SN_CFLAGS: ${{ matrix.sn_cflags }}
      SN_RELEASE_CFLAGS: ${{ matrix.sn_release_cflags }}
      SN_RUSTFLAGS: ${{ matrix.rust_flags }}
      SN_EXCLUDE_TESTS: ''
      SN_PARITY_WORKERS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
    - *checkout
    - name: Setup compiler toolchain
      timeout-minutes: 15
      uses: ./.github/actions/compiler-toolchain
      with:
        rust_target: ${{ matrix.rust_target }}
    - name: Download the platform build
      uses: actions/download-artifact@v8
      with:
        name: compiler-bundle-${{ matrix.os }}
        path: .sn/artifact
    - name: Restore and verify compiler bundle
      shell: bash
      run: python3 scripts/ci/build_bundle.py restore .sn/artifact/compiler-bundle.tar.gz
    - name: Run ${{ matrix.group }} validation
      shell: bash
      run: python3 scripts/ci/run_gates.py --group "${{ matrix.group }}"
    - name: Retain gate logs and runtime evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ci-evidence-${{ matrix.os }}-${{ matrix.group }}
        path: |
          .sn/ci-reports/
          .sn/rust-runtime-diagnostics/
          .sn/rust-parity-*.json
          .sn/*-lifetimes.json
          .sn/static-callback-ownership.json
          .sn/record-reference-snapshots.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  evidence:
    name: Verify complete CI coverage
    needs:
    - build
    - tests
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - *checkout
    - name: Download every test report
      uses: actions/download-artifact@v8
      with:
        pattern: ci-evidence-*
        path: .sn/ci-evidence/incoming
    - name: Require every platform and gate
      shell: bash
      run: python3 scripts/ci/collect_reports.py .sn/ci-evidence/incoming .sn/ci-evidence/complete
    - name: Retain ubuntu-latest runtime diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rust-runtime-diagnostics-ubuntu-latest
        path: .sn/ci-evidence/complete/ubuntu-latest
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Retain windows-latest runtime diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rust-runtime-diagnostics-windows-latest
        path: .sn/ci-evidence/complete/windows-latest
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Retain macos-latest runtime diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rust-runtime-diagnostics-macos-latest
        path: .sn/ci-evidence/complete/macos-latest
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Retain CI coverage summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: compiler-ci-coverage
        path: .sn/ci-evidence/complete/summary.json
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
  publish:
    name: Validated artifacts (${{ matrix.os }})
    needs: evidence
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: *platforms
    steps:
    - *checkout
    - name: Download validated build
      uses: actions/download-artifact@v8
      with:
        name: compiler-bundle-${{ matrix.os }}
        path: .sn/artifact
    - name: Restore validated build
      shell: bash
      run: python3 scripts/ci/build_bundle.py restore .sn/artifact/compiler-bundle.tar.gz
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          bin/sn${{ matrix.exe_ext }}
          bin/tests${{ matrix.exe_ext }}
          bin/lib/${{ matrix.runtime_dir }}/libsn_runtime_min.a
          bin/include/**/*
          bin/*.cfg
        retention-days: 7
  check:
    name: Compiler CI
    needs:
    - build
    - tests
    - evidence
    - publish
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require all validation jobs
      shell: bash
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = [name for name, result in results.items() if result['result'] != 'success']
        if failed:
            raise SystemExit('CI incomplete or failed: ' + ', '.join(failed))
        print('All compiler, C/Rust, parity and lifetime checks passed.')
        PY
