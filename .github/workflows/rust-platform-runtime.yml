name: Rust Platform Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Rust runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe_ext: ''
            sn_cc: gcc
            sn_cflags: ''
            sn_release_cflags: ''
            rust_target: ''
            rust_flags: ''

          - os: windows-latest
            exe_ext: '.exe'
            sn_cc: clang
            sn_cflags: '--target=x86_64-w64-mingw32 -fuse-ld=lld -rtlib=compiler-rt -unwindlib=none'
            sn_release_cflags: '-O3 -fwrapv'
            rust_target: 'x86_64-pc-windows-gnullvm'
            rust_flags: '--target=x86_64-pc-windows-gnullvm -C linker=clang'

          - os: macos-latest
            exe_ext: ''
            sn_cc: clang
            sn_cflags: ''
            sn_release_cflags: ''
            rust_target: ''
            rust_flags: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Setup prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install python3

      - name: Install LLVM-MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # LLVM 19's ASan cannot decode the Windows 11 24H2 CRT prologue.
          $version = "20260616"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip"
          $zipPath = "$env:TEMP\llvm-mingw.zip"
          $extractPath = Join-Path $env:GITHUB_WORKSPACE ".sn\toolchains\llvm-mingw"

          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $expectedHash = "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"
          if ((Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw "LLVM-MinGW archive SHA-256 mismatch"
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $llvmDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          $binPath = Join-Path $llvmDir.FullName "bin"
          echo "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Make and Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make ninja -y

      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add --toolchain 1.93.1 "${{ matrix.rust_target }}"
          fi
          rustc --version --verbose
          if [ "$RUNNER_OS" = "Windows" ]; then clang --version; fi

      - name: Setup libs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SN_SKIP_PREREQS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: make setup

      - name: Verify pinned Windows compiler after setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchainRoot = Join-Path $env:GITHUB_WORKSPACE ".sn\toolchains\llvm-mingw"
          $toolchain = Get-ChildItem $toolchainRoot -Directory | Select-Object -First 1
          $expected = Join-Path $toolchain.FullName "bin\clang.exe"
          $selected = (Get-Command clang.exe).Source
          if ($selected -ne $expected) { throw "Expected pinned clang $expected, selected $selected" }
          clang --version

      - name: Build
        shell: bash
        run: make build

      - name: Verify compiler output
        shell: bash
        run: |
          if [ ! -f "bin/sn${{ matrix.exe_ext }}" ]; then
            echo "ERROR: bin/sn${{ matrix.exe_ext }} not found"
            exit 1
          fi

      - name: Run Rust suites and runtime parity gates
        shell: bash
        env:
          SN_CC: ${{ matrix.sn_cc }}
          SN_CFLAGS: ${{ matrix.sn_cflags }}
          SN_RELEASE_CFLAGS: ${{ matrix.sn_release_cflags }}
          SN_RUSTFLAGS: ${{ matrix.rust_flags }}
          SN_EXCLUDE_TESTS: ''
          PYTHONUNBUFFERED: '1'
        run: |
          overall_rc=0

          run_gate() {
            gate_name="$1"
            shift
            echo "::group::$gate_name"
            if "$@"; then
              gate_rc=0
            else
              gate_rc=$?
            fi
            echo "::endgroup::"
            if [ "$gate_rc" -eq 0 ]; then
              echo "- PASS: $gate_name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- FAIL: $gate_name (exit $gate_rc)" >> "$GITHUB_STEP_SUMMARY"
              overall_rc=1
            fi
          }

          run_gate "tagged native C/Rust parity (8 fixtures)" \
            python3 scripts/run_rust_tests.py rust-native-tagged --verbose \
              --require-count 8 --fail-on-skip
          run_gate "native scalar, record and managed ABI fixtures (298 fixtures)" \
            python3 scripts/run_rust_tests.py rust-native-extra --verbose \
              --require-count 298 --fail-on-skip
          run_gate "canonical native handle ownership (117 cases)" \
            make -o build test-rust-parity-native-handles
          run_gate "canonical native reference arrays (27 cases)" \
            make -o build test-rust-parity-native-arrays
          run_gate "global native owners and joined thread results (36 cases)" \
            make -o build test-rust-parity-native-globals
          run_gate "native record value transport (45 cases)" \
            make -o build test-rust-parity-native-records
          run_gate "native C callable definitions, globals and threads (63 cases)" \
            make -o build test-rust-parity-native-callables
          run_gate "native variadic C adapters and ownership (54 cases)" \
            make -o build test-rust-parity-native-variadics
          run_gate "owned as-val arrays, callable elements and method owners (45 cases)" \
            make -o build test-rust-parity-array-values
          run_gate "owned byte-pointer slices and scalar bounds (45 cases)" \
            make -o build test-rust-parity-pointer-slices
          run_gate "serialization vtables, fields and lifetimes (117 cases)" \
            make -o build test-rust-parity-serialization
          run_gate "native managed record storage and ownership (54 cases)" \
            make -o build test-rust-parity-native-managed-records
          run_gate "native record references and stable storage (36 cases)" \
            make -o build test-rust-parity-native-record-references
          run_gate "owned record parameters, aliases and field forwarding (216 cases)" \
            make -o build test-rust-parity-owned-record-parameters
          run_gate "reference records, return lifetimes and copy hooks (171 cases)" \
            make -o build test-rust-parity-reference-records
          run_gate "scalar parameter characters, aliases and storage conversions (126 cases)" \
            make -o build test-rust-parity-scalar-parameters
          run_gate "closure record lifetimes, aliases and mutation (189 cases)" \
            make -o build test-rust-parity-closure-records
          run_gate "native ABI admission diagnostics (4 fixtures)" \
            python3 scripts/run_rust_tests.py rust-native-errors --verbose \
              --require-count 4 --fail-on-skip
          run_gate "nested array stores and copy independence (45 cases)" \
            make -o build test-rust-parity-nested-stores
          run_gate "owned struct and nested array copies (45 cases)" \
            make -o build test-rust-parity-owned-array-copies
          run_gate "nil array state and native transport (90 cases)" \
            make -o build test-rust-parity-nil-array
          run_gate "nil string state and native transport (72 cases)" \
            make -o build test-rust-parity-nil-string
          run_gate "C-only native helper scope (36 cases)" \
            make -o build test-rust-parity-native-scope
          run_gate "imported native alias origin (1 fixture)" \
            python3 scripts/run_rust_tests.py rust-native-origin --verbose \
              --require-count 1 --fail-on-skip
          echo "Unix byte coverage requires 30 raw-output C/Rust pairs (60 target executions) plus 3 Rust-only raw-byte argv executions."
          echo "Windows byte coverage requires 30 exact C/Rust text-mode raw-output pairs plus 3 Rust-only UTF-16/WTF-8 argv executions."
          run_gate "platform-specific raw byte-string behavior" \
            python3 tests/rgen/byte_string_compare.py
          run_gate "exact Rust/C text output, native flush, and diagnostics" \
            python3 tests/rgen/windows_text_transport_compare.py
          run_gate "indexed member Rust runtime composition" \
            python3 scripts/run_rust_tests.py rgen --filter indexed_member_assignment \
              --verbose --require-count 1 --fail-on-skip
          run_gate "Windows text helper logic" \
            python3 tests/rgen/windows_text_helpers.py
          run_gate "complete Rust generation, diagnostics, native, closure, concurrency and toolchain suites" \
            python3 scripts/run_rust_tests.py all --verbose --fail-on-skip
          run_gate "core C/Rust differential coverage at O0/O1/O2" \
            make test-rust-parity-core
          run_gate "concurrency C/Rust differential coverage (17 sources, O0/O1/O2)" \
            make test-rust-parity-concurrency
          run_gate "thread ownership and array identity (23 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-thread-ownership
          run_gate "thread receiver and aggregate ownership (10 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-thread-receivers

          run_gate "reflection metadata and sized arrays (4 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-reflection

          run_gate "sized-array defaults and evaluation effects (3 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-sized-defaults

          run_gate "zero-initialized value records (3 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-zero-record-defaults

          run_gate "managed iterator protocol (8 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-managed-iterators

          run_gate "borrowed array return ownership (3 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-array-returns

          run_gate "closure array mutation, ownership and aliases (21 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-closure-arrays

          run_gate "closure array mutation methods (8 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-array-methods

          run_gate "closure array alias partitions (8 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-array-alias-partitions

          run_gate "closure array method aliases (8 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-method-aliases

          run_gate "reference-record receivers and native closure ownership (5 sources, all modes)" \
            make test-rust-parity-reference-receivers

          run_gate "captured value-record methods and borrowed field printing (5 sources, all modes)" \
            make test-rust-parity-captured-methods

          run_gate "owned as-val closure array rebinding (11 sources, all modes)" \
            make test-rust-parity-array-rebinding

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "owned array rebinding C lifetimes with ASAN/UBSAN/leaks (33 cases)" \
              python3 scripts/check_c_array_rebinding_lifetimes.py
          fi

          run_gate "owned closure string rebinding (8 sources, all modes)" \
            make test-rust-parity-string-rebinding

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "string rebinding C lifetimes with ASAN/UBSAN/leaks (24 cases)" \
              python3 scripts/check_c_string_rebinding_lifetimes.py
          fi

          run_gate "private closure array rebinding (15 sources, all modes)" \
            make test-rust-parity-private-arrays

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "private array C lifetimes with ASAN/UBSAN/leaks (45 cases)" \
              python3 scripts/check_c_private_array_lifetimes.py
          fi

          run_gate "native primitive arrays (13 sources, all modes)" \
            make test-rust-parity-native-primitive-arrays

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "native primitive array C lifetimes with ASAN/UBSAN/leaks (39 cases)" \
              python3 scripts/check_c_native_primitive_array_lifetimes.py
          fi

          run_gate "scalar snapshot reference forwarding (12 sources, all modes)" \
            make test-rust-parity-scalar-snapshot-references

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "scalar snapshot C lifetimes with ASAN/UBSAN/leaks (36 cases)" \
              python3 scripts/check_c_scalar_snapshot_reference_lifetimes.py
          fi

          run_gate "lexical capture scopes (11 sources, all modes)" \
            make test-rust-parity-capture-scopes

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "capture scope C lifetimes with ASAN/UBSAN/leaks (33 cases)" \
              python3 scripts/check_c_capture_scope_lifetimes.py
          fi

          run_gate "physical value-record receivers (22 sources, all modes)" \
            make test-rust-parity-physical-receivers

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "physical receiver C lifetimes with ASAN/UBSAN/leaks (66 cases)" \
              python3 scripts/check_c_physical_receiver_lifetimes.py
            run_gate "physical receiver Rust lifetimes with ASAN/leaks (66 cases)" \
              python3 scripts/check_rust_physical_receiver_lifetimes.py
          fi

          run_gate "borrowed scalar captures (21 sources, all modes)" \
            make test-rust-parity-borrowed-captures

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "borrowed scalar C lifetimes with ASAN/UBSAN/leaks (63 cases)" \
              python3 scripts/check_c_borrowed_capture_lifetimes.py
            run_gate "borrowed scalar Rust lifetimes with ASAN/leaks (63 cases)" \
              python3 scripts/check_rust_borrowed_capture_lifetimes.py
          fi

          run_gate "owned as-val closure record parameters (17 sources, all modes)" \
            make test-rust-parity-owned-record-parameters-closures

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "owned record parameter C lifetimes with ASAN/UBSAN/leaks (51 cases)" \
              python3 scripts/check_c_owned_record_parameter_lifetimes.py
          fi

          run_gate "scalar closure value parameter mutations (16 sources, all modes)" \
            make test-rust-parity-closure-value-parameters

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "scalar closure value parameter C lifetimes with ASAN/UBSAN/leaks (48 cases)" \
              python3 scripts/check_c_closure_value_parameter_lifetimes.py
          fi

          run_gate "scalar closure reference storage and evaluation (26 sources, all modes)" \
            make test-rust-parity-closure-references

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "scalar closure reference C lifetimes with ASAN/UBSAN/leaks (78 cases)" \
              python3 scripts/check_c_closure_reference_lifetimes.py
          fi

          run_gate "qualified closure array copies (7 sources, all modes)" \
            make test-rust-parity-qualified-arrays

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "qualified closure array C lifetimes with ASAN/UBSAN/leaks (21 cases)" \
              python3 scripts/check_c_qualified_array_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "captured-record/field-string C lifetimes with ASAN/UBSAN/leaks (15 cases)" \
              python3 scripts/check_c_captured_method_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "reference-record C ownership with ASAN/UBSAN/leak checks (15 cases)" \
              python3 scripts/check_c_reference_receiver_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "closure array method aliases with ASAN/UBSAN/leak checks (24 cases)" \
              python3 scripts/check_c_method_alias_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "closure array alias partitions with ASAN/UBSAN/leak checks (24 cases)" \
              python3 scripts/check_c_array_alias_partition_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "closure array methods with ASAN/UBSAN/leak checks (24 cases)" \
              python3 scripts/check_c_array_method_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "closure array C ownership with ASAN/UBSAN/leak checks (63 cases)" \
              python3 scripts/check_c_closure_array_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "borrowed array returns with ASAN/UBSAN/leak checks (9 cases)" \
              python3 scripts/check_c_array_return_lifetimes.py
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            run_gate "iterator C ownership with ASAN/UBSAN/leak checks (24 cases)" \
              python3 scripts/check_c_iterator_lifetimes.py
          fi

          run_gate "native managed results and scalar references (7 sources, all optimization/arithmetic modes)" \
            make test-rust-parity-native-managed

          run_gate "C diagnostic statuses and stdout/stderr order (30 paired cases, 120 executions)" \
            make test-rust-parity-stdio-order

          run_gate "mixed integer conversions (90 positive pairs, 9 checked diagnostic cases)" \
            make test-rust-parity-mixed-integral

          run_gate "floating storage, calls and mixed mutation precision (117 positive pairs)" \
            make test-rust-parity-float-conversions

          run_gate "floating array argument representation and mutation (81 positive pairs)" \
            make test-rust-parity-floating-arrays

          run_gate "floating array byte equality (36 positive pairs)" \
            make test-rust-parity-floating-equality

          run_gate "computed numeric mutation and owner timing (153 positive pairs)" \
            make test-rust-parity-numeric-places

          run_gate "captured array indexed writes and callback visibility (45 positive pairs)" \
            make test-rust-parity-capture-index

          run_gate "synchronized character mutation and wraparound (45 positive pairs)" \
            make test-rust-parity-sync-character

          run_gate "character methods and C locale string semantics (72 positive pairs)" \
            make test-rust-parity-ctype

          run_gate "byte encodings and native object views (81 positive pairs)" \
            make test-rust-parity-byte-encoding

          run_gate "process exit statuses, buffered streams and CRT lifecycle (153 cases)" \
            make test-rust-parity-exit

          run_gate "normal main return, buffered streams and CRT callbacks (108 cases)" \
            make test-rust-parity-main-return

          run_gate "match control flow, character places and local atomic locks (180 positive pairs)" \
            make test-rust-parity-match-control

          run_gate "C sizeof layouts and native-local aggregates (216 positive pairs)" \
            make test-rust-parity-sizeof
          run_gate "C sizeof fallback and borrowed reference calls (126 positive pairs)" \
            make test-rust-parity-call-reference
          run_gate "Indexed string copies, lifetimes and evaluation order (54 positive pairs)" \
            make test-rust-parity-indexed-string

          exit "$overall_rc"

      - name: Retain runtime parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-runtime-diagnostics-${{ matrix.os }}
          path: |
            .sn/rust-runtime-diagnostics/
            .sn/rust-parity-*.json
            .sn/c-iterator-lifetimes.json
            .sn/c-array-return-lifetimes.json
            .sn/c-closure-array-lifetimes.json
            .sn/c-array-method-lifetimes.json
            .sn/c-array-alias-partition-lifetimes.json
            .sn/c-method-alias-lifetimes.json
            .sn/c-reference-receiver-lifetimes.json
            .sn/c-captured-method-lifetimes.json
            .sn/c-qualified-array-lifetimes.json
            .sn/c-closure-reference-lifetimes.json
            .sn/c-closure-value-parameter-lifetimes.json
            .sn/c-owned-record-parameter-lifetimes.json
            .sn/c-array-rebinding-lifetimes.json
            .sn/c-string-rebinding-lifetimes.json

            .sn/c-private-array-lifetimes.json

            .sn/c-native-primitive-array-lifetimes.json

            .sn/c-scalar-snapshot-reference-lifetimes.json

            .sn/c-capture-scope-lifetimes.json
            .sn/c-physical-receiver-lifetimes.json
            .sn/rust-physical-receiver-lifetimes.json
            .sn/c-borrowed-capture-lifetimes.json
            .sn/rust-borrowed-capture-lifetimes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
